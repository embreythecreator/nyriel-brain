name: plane-platform
label: Plane
kind: platform
version: 1.0.0
description: >
  Plane gateway adapter for Nyriel Brain.
  Connects to a Plane community relay (Oblivion's open-source human+agent
  collaboration platform built on Nostr) and relays messages between
  channels/DMs and the Nyriel agent. Relay operations shell out to the
  plane CLI binary (JSON in/out); verified inbound media uses Nyriel' bundled
  HTTP client.
author: Nyriel
# ``requires_env`` entries are surfaced in ``nyriel config`` UI via the
# platform-plugin env var injector in ``nyriel_cli/config.py``.
requires_env:
  - name: PLANE_RELAY_URL
    description: "Base URL of the Plane community relay (e.g. https://plane.0blivion.io)"
    prompt: "Plane relay URL"
    password: false
  - name: PLANE_PRIVATE_KEY
    description: "Nostr private key for the agent's Plane identity (nsec or hex) — the only Plane secret"
    prompt: "Nostr private key (nsec or hex)"
    password: true
optional_env:
  - name: PLANE_TRANSPORT
    description: "Inbound transport: auto (WebSocket w/ poll fallback, default), websocket, or poll"
    prompt: "Transport (auto/websocket/poll)"
    password: false
  - name: PLANE_AUTH_TAG
    description: "Optional NIP-OA owner-attestation auth tag JSON for NIP-42 WebSocket auth"
    prompt: "NIP-OA auth tag JSON (or empty)"
    password: false
  - name: PLANE_CHANNELS
    description: "Comma-separated channel UUIDs to watch (default: all joined channels)"
    prompt: "Channel UUIDs (comma-separated)"
    password: false
  - name: PLANE_HOME_CHANNEL
    description: "Channel UUID for cron / notification delivery (defaults to the first watched channel)"
    prompt: "Home channel UUID (or empty)"
    password: false
  - name: PLANE_ALLOWED_USERS
    description: "Comma-separated npubs or hex pubkeys allowed to talk to the agent"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: PLANE_ALLOW_ALL_USERS
    description: "Allow any community member to talk to the agent (true/false)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: PLANE_POLL_INTERVAL
    description: "Seconds between inbound poll sweeps (default: 4)"
    prompt: "Poll interval seconds"
    password: false
  - name: PLANE_CLI_PATH
    description: "Path to the plane CLI binary (default: 'plane' on PATH, then ~/bin/plane)"
    prompt: "plane CLI path (or empty)"
    password: false
  - name: PLANE_CREDENTIALS_FILE
    description: "JSON credentials file holding the nsec (fallback when PLANE_PRIVATE_KEY is unset)"
    prompt: "Credentials file path (or empty)"
    password: false
  - name: PLANE_REPLY_IN_THREAD
    description: "Thread replies under the triggering message (true/false, default: true); false posts flat to the channel timeline"
    prompt: "Reply in thread? (true/false)"
    password: false
